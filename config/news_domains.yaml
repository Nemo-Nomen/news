  # OBS 2026-09-20: biluppgifter.se och kvd.se (bilregister/marknadsplats,
  # 131+93 besök) togs bort härifrån - lägre volym på just dessa
  # nyhetssajter jämfört med köp-/leasingklustret (upp till 112 besök,
  # se domain_exclusions.yaml bil_transaktion) bekräftade att det är en
  # faktisk bilaffär, inte nytt-modell-intresse. Testet: äkta intresse för
  # nya modeller borde synas MER på nyhetssajter, inte mindre.
  - vibilagare.se
  - autoevolution.com
  - car.info

# Bekräftade intressesignaler 2026-09-20, men oklart vilken av de fyra
