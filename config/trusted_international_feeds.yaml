# Kända internationella källor med egna RSS-flöden, hämtas lokalt i
# Fas 5 (gratis) och läggs i samma "internationellt"-pool som
# finance-news-MCP:n skriver till. Går igenom NORMAL poängsättning
# (till skillnad från newsletter_feeds.yaml som alltid tas med) -
# det här är allmänna nyhetskällor, inte personliga prenumerationer.
#
# EFN saknar eget RSS-flöde (kollat 2026-09-21: 404, modern JS-sajt
# utan feed) - dyker redan upp naturligt via Google Nyheter-sökningarna,
# ingen åtgärd behövs.
# Financial Times och Wall Street Journal hämtas via finance-news-MCP:n
# istället (redan namngivna källor där) - ingen egen RSS-hämtning här
# för att undvika dubbelarbete.
#
# Kollat 2026-09-22 (önskade källor: Kvartal, Epoch Times, 100.se,
# Bulletin, Gavekal):
# - Epoch Times svenska (epochtimes.se) saknar eget RSS-flöde (modern
#   JS-sajt, samma situation som EFN) - använder istället internationella
#   Epoch Times egna Europe-flöde nedan.
# - Kvartal, Bulletin och 100.se saknar alla publikt RSS-flöde (moderna
#   JS-sajter utan feed, bara sitemap.xml som inte fungerar för
#   XML-parsern i fetch_trusted_international.py). Dyker upp naturligt
#   via Google Nyheter-sökningarna om Google indexerar dem, annars ingen
#   åtgärd möjlig utan att skriva en sajt-specifik skrapare.
# - Gavekal Research är en betald institutionell tjänst (prenumeranter
#   only) - inget publikt RSS-flöde finns eller kan förväntas finnas.
#
# Källupptäckt via Omni 2026-09-22 (se PROJECT_PLAN.md avsnitt 9):
# bläddrade igenom omni.se:s ekonomi- och tech-sidor och noterade vilka
# primärkällor de själva citerar mest. De flesta (CNBC, Bloomberg,
# Barron's, WSJ/FT) täcks redan via finance-news-MCP:n eller Google
# Nyheter-sökningarna. Två nya lades till nedan eftersom de hade
# fungerande flöden OCH inte redan täcktes:
# - SR Ekot (Sveriges Radios nyhetsredaktion) - rakt faktabaserad
#   radionyhetsbevakning snarare än opinion, lägre risk för den
#   redaktionella vinkel-oron som gäller för politik-kategorin.
# - The Verge - matchar AI-kategorins "kapabilitetsnyheter"-vinkel
#   (se config/interests.yaml) bättre än de källor som redan fanns.
# Båda ger Atom-flöden, inte RSS 2.0 - fetch_trusted_international.py
# uppdaterad 2026-09-22 för att tolka båda formaten.
#
# All-In Podcast (önskad källa, tillagd 2026-09-22): allin.com har
# inget eget RSS-flöde (404 överallt), men det riktiga poddflödet
# hittades via iTunes Search API (feedUrl-fältet för podcast-id
# 1502871393, "All-In Podcast, LLC" - den officiella, inte de andra
# ospårade träffarna i sökningen). Vanlig RSS 2.0, verifierad fungera
# direkt med befintlig parser (427 poster). Lagd under ekonomi (VC/
# makro/business är showens kärna) även om enskilda avsnitt ofta
# handlar minst lika mycket om AI eller politik - flytta om det visar
# sig missvisande i praktiken. OBS: poddavsnitt ger bara titel+länk
# till avsnittssidan (samma som andra RSS-källor), ingen transkription
# - kureringen får jobba med avsnittstiteln som kontext, som för
# nyhetsbreven.

