name: Uppdatera börsticker

# Kör på GitHub:s egna servrar - helt oberoende av om Axels dator är
# igång. Hämtar aktuella kurser (src/fetch_ticker.py) och committar
# docs/ticker.json om något ändrats. Se PROJECT_PLAN.md avsnitt 7.
on:
  schedule:
    - cron: "5 6,10,14,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-ticker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hämta kurser
        run: python3 src/fetch_ticker.py

      - name: Committa ticker.json om det ändrats
        run: |
          if ! git diff --quiet -- docs/ticker.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/ticker.json
            git commit -m "Uppdatera börsticker"
            git push
          else
            echo "Inga förändringar i ticker.json"
          fi
